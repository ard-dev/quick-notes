<!DOCTYPE html>
<html>
<body>
<p>Right-click each image and "Save image as" to save the icons:</p>

<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>

<script>
function drawIcon(canvas) {
    const s = canvas.width;
    const ctx = canvas.getContext('2d');

    // Background
    ctx.fillStyle = '#e94560';
    ctx.beginPath();
    ctx.roundRect(0, 0, s, s, s * 0.2);
    ctx.fill();

    // Text
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${s * 0.45}px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('N', s / 2, s / 2 + s * 0.02);
}

[document.getElementById('c192'), document.getElementById('c512')].forEach(drawIcon);

// Auto-download
['c192', 'c512'].forEach(id => {
    const canvas = document.getElementById(id);
    const link = document.createElement('a');
    link.download = `icon-${canvas.width}.png`;
    link.href = canvas.toDataURL();
    link.click();
});
</script>
</body>
</html>
