<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Notes</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        h1 { font-size: 24px; color: #e94560; }

        .status {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
            background: #16213e;
        }

        .status.online { color: #4ecca3; }
        .status.offline { color: #e94560; }

        .add-section {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #16213e;
            border-radius: 10px;
            background: #16213e;
            color: #eee;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus { border-color: #e94560; }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #e94560;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background: #c73650; }

        .notes { display: flex; flex-direction: column; gap: 10px; }

        .note {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: #16213e;
            border-radius: 10px;
            animation: slideIn 0.2s ease;
        }

        .note span { flex: 1; font-size: 16px; }

        .note .delete {
            background: none;
            color: #e94560;
            font-size: 20px;
            padding: 4px 10px;
        }

        .note .delete:hover { color: #ff6b81; }

        .empty {
            text-align: center;
            color: #555;
            margin-top: 60px;
            font-size: 18px;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <header>
        <h1>Quick Notes</h1>
        <span class="status" id="status">online</span>
    </header>

    <div class="add-section">
        <input type="text" id="noteInput" placeholder="Type a note..." autofocus>
        <button onclick="addNote()">Add</button>
    </div>

    <div class="notes" id="notesList"></div>

    <script>
        let notes = JSON.parse(localStorage.getItem('notes') || '[]');

        function save() {
            localStorage.setItem('notes', JSON.stringify(notes));
        }

        function render() {
            const list = document.getElementById('notesList');
            if (notes.length === 0) {
                list.innerHTML = '<p class="empty">No notes yet</p>';
                return;
            }
            list.innerHTML = notes.map((note, i) => `
                <div class="note">
                    <span>${escapeHtml(note)}</span>
                    <button class="delete" onclick="deleteNote(${i})">×</button>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addNote() {
            const input = document.getElementById('noteInput');
            const text = input.value.trim();
            if (!text) return;
            notes.unshift(text);
            save();
            render();
            input.value = '';
            input.focus();
        }

        function deleteNote(index) {
            notes.splice(index, 1);
            save();
            render();
        }

        document.getElementById('noteInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') addNote();
        });

        // Online/offline status
        function updateStatus() {
            const el = document.getElementById('status');
            if (navigator.onLine) {
                el.textContent = 'online';
                el.className = 'status online';
            } else {
                el.textContent = 'offline';
                el.className = 'status offline';
            }
        }
        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        updateStatus();

        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        render();
    </script>
</body>
</html>
